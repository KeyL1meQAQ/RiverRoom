map $http_upgrade $poker_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    listen 8443 ssl;
    server_name 160.202.237.14;

    ssl_certificate /opt/livekit/tls/livekit.crt;
    ssl_certificate_key /opt/livekit/tls/livekit.key;

    access_log /var/log/nginx/poker-access.log;
    error_log /var/log/nginx/poker-error.log;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $poker_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}
